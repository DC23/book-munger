[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-munger"
version = "0.1.0"
description = "Generate freely-distributable thematic word frequency tables from source texts"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "click>=8.0",
    "jinja2>=3.0",
    "spacy>=3.0",
    "wordfreq>=3.0",
]

[project.scripts]
book-munger = "book_munger.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
